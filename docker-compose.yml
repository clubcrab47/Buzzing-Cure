services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: bc
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bc_secret_change_me}
      POSTGRES_DB: buzzing
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bc -d buzzing"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://bc:${POSTGRES_PASSWORD:-bc_secret_change_me}@db:5432/buzzing
      BOT_TOKEN: ${BOT_TOKEN}
      WEBAPP_URL: ${WEBAPP_URL}
      PORT: 3000
    ports:
      - "3000:3000"

volumes:
  pgdata:
